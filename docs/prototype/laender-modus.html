    </sc-if>
  </div>
</div>

      next: this.next, nextLabel: st.qi + 1 >= Q.length ? 'Steckbrief' : 'Weiter',
      scoreTxt: st.shown + '/' + Q.length,
      facts: Q.map((qq, i) => ({ label: qq.label, value: land[qq.k][0] === land.id ? land.n : land[qq.k][0], isFlag: qq.k === 'flag', bg: this.flagBg(land.id), mark: st.results[i] ? '#111' : accent, delay: (120 + i * 60) + 'ms' })),
      nextLand: this.nextLand
    };
  }
}
</script>
</body>
