<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GeoQuiz – Finden</title>
<script src="./support.js"></script>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#F1F1F1}
a{color:#111}a:hover{color:#000}
.gq *{box-sizing:border-box}.gq button:focus-visible,.gq a:focus-visible{outline:3px solid #111;outline-offset:2px}
.flag{background-image:url(/_blob/78a49d8fb5084507a21c31a0c39272c1);background-repeat:no-repeat;aspect-ratio:4/3;display:block}
.gq-map{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.gq-map.drag{cursor:grabbing}
.gq-map path{vector-effect:non-scaling-stroke;stroke:#111;stroke-width:.8px;stroke-linejoin:round;fill:#fff;transition:fill .35s ease}
.gq-map .live path.land:hover{fill:#D6D6D6;cursor:pointer}
.gq-map path.target{fill:#111}.gq-map path.wrong{fill:var(--accent)}.gq-map path.off{fill:#E4E4E4}
.gq-map line{vector-effect:non-scaling-stroke;stroke:#111;stroke-opacity:.14;stroke-width:1px}
.gq-sq{width:48px;height:48px;border:2px solid #111;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:inherit;transition:background .15s,color .15s}.gq-sq:hover{background:#111;color:#fff}

.in-a{animation:gqA .5s cubic-bezier(.2,.8,.2,1) both}.in-b{animation:gqB .5s cubic-bezier(.2,.8,.2,1) both}

.pop-a{display:inline-block;animation:gqPa .45s cubic-bezier(.2,.8,.2,1)}.pop-b{display:inline-block;animation:gqPb .45s cubic-bezier(.2,.8,.2,1)}

<div class="gq" style="position:relative;width:100%;height:100vh;overflow:hidden;background:#F1F1F1;font-family:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;color:#111;--accent:{{accent}};--ok:{{ok}}">

        <g class="{{liveCls}}" style="transform-origin:0 0;transform:{{tf}};transition:{{tr}}">
          <sc-for list="{{copies}}" as="cp" hint-placeholder-count="3">
            <g transform="{{cp.t}}">
              <rect x="0" y="0" width="{{mw}}" height="{{mh}}" fill="#F1F1F1"></rect>
              <sc-for list="{{gx}}" as="gl" hint-placeholder-count="12"><line x1="{{gl.v}}" x2="{{gl.v}}" y1="0" y2="{{mh}}"></line></sc-for>
              <sc-for list="{{gy}}" as="gl" hint-placeholder-count="6"><line x1="0" x2="{{mw}}" y1="{{gl.v}}" y2="{{gl.v}}"></line></sc-for>
              <sc-for list="{{countries}}" as="c" hint-placeholder-count="0"><path d="{{c.d}}" class="{{c.cls}}" onClick="{{c.pick}}"></path></sc-for>
            </g>
          </sc-for>
        </g>
      </svg>
    </sc-if>
    <sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase">Karte lädt</div>
    </sc-if>
  </div>

  <div style="position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:72px;max-width:460px;background:#fff;border:2px solid #111">
    <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:2px solid #111;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums">
      <span>Finden</span><span>{{counter}}</span><span><span class="{{popCls}}">{{scorePad}}</span> Punkte</span>
    </div>
    <div style="display:flex;align-items:flex-end;gap:12px;padding:10px 12px 14px">
      <div style="flex:1 1 auto;min-width:0">
        <div style="font-size:14px;font-weight:500">Wo liegt</div>
        <div class="{{anim}}" style="font-size:{{nameSize}};line-height:1;font-weight:800;letter-spacing:-.035em;margin-top:6px;hyphens:auto;overflow-wrap:anywhere">{{targetName}}</div>
      </div>
      <span class="flag {{flagAnim}}" role="img" aria-label="Flagge von {{targetName}}" style="flex:0 0 auto;width:56px;outline:2px solid #111;{{targetFlag}}"></span>
    </div>
  </div>

  <button class="gq-sq" onClick="{{openMenu}}" aria-label="Menü öffnen" style="position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px">
    <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="2"></path></svg>
  </button>

  <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none">
      <button onClick="{{skip}}" style="pointer-events:auto;height:48px;padding:0 16px;border:2px solid #111;background:#fff;color:#111;font:inherit;font-size:14px;font-weight:700;cursor:pointer">Überspringen</button>
      <div style="pointer-events:auto;display:flex;flex-direction:column">
        <button class="gq-sq" onClick="{{zoomIn}}" aria-label="Hineinzoomen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0v16M0 8h16" stroke="currentColor" stroke-width="2"></path></svg></button>
        <button class="gq-sq" onClick="{{zoomOut}}" aria-label="Herauszoomen" style="margin-top:-2px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M0 8h16" stroke="currentColor" stroke-width="2"></path></svg></button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">

          </sc-if>
        </div>
        <div style="font-size:15px;line-height:1.35;text-wrap:pretty">{{detail}}</div>
      </div>
      <button ref="{{focusBtn}}" onClick="{{next}}" style="position:relative;width:100%;height:56px;border:0;border-top:2px solid #111;background:#111;color:#fff;font:inherit;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 14px;cursor:pointer">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px">
        <div style="font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase">GeoQuiz</div>
        <button class="gq-sq" onClick="{{closeMenu}}" aria-label="Menü schließen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1l14 14M15 1L1 15" stroke="currentColor" stroke-width="2"></path></svg></button>
      </div>
      <div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding-bottom:8px">Modus</div>
      <nav style="display:flex;flex-direction:column;border-top:2px solid #111;max-width:560px">
        <button class="gq-item" onClick="{{closeMenu}}" style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border:0;border-bottom:2px solid #111;background:none;color:#111;font:inherit;text-align:left;cursor:pointer">
          <span style="font-size:12px;font-weight:600;font-variant-numeric:tabular-nums">01</span><span style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">Finden</span>
        </button>
        <div style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:2px solid #111;color:#6B6B6B">
          <span style="font-size:12px;font-weight:600">02</span><span style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">Benennen</span><span style="margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Folgt</span>
        </div>
        <a class="gq-item" href="Flaggen.dc.html" style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:2px solid #111;color:#111;text-decoration:none">
          <span style="font-size:12px;font-weight:600">03</span><span style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">Flaggen</span><span style="margin-left:auto;font-size:20px" aria-hidden="true">→</span>
        </a>
        <a class="gq-item" href="Land.dc.html" style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:2px solid #111;color:#111;text-decoration:none">
          <span style="font-size:12px;font-weight:600">04</span><span style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">Länder</span><span style="margin-left:auto;font-size:20px" aria-hidden="true">→</span>
        </a>
        <div style="display:flex;align-items:baseline;gap:14px;padding:14px 0;border-bottom:2px solid #111;color:#6B6B6B">
          <span style="font-size:12px;font-weight:600">05</span><span style="font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1">Statistik</span><span style="margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Folgt</span>
        </div>
      </nav>
    </div>
  </sc-if>
</div>

      const d = (((bx + bw / 2 - cx) % W) + 1.5 * W) % W - W / 2;
      const screenY = topH + availH / 2;
      this.setState({ z, cx: cx + d, cy: this.clampCy(by + bh / 2 - (screenY - vh / 2) / s, s), mode: 'fly' });
    });
  }
  renderVals() {
    const st = this.state, d = st.data, accent = this.props.accent ?? '#E3000F', okc = this.props.ok ?? '#00A651';
    const t = d ? this.target() : null;
    const s = this.s0() * st.z;
    const tx = st.vw / 2 - st.cx * s, ty = st.vh / 2 - st.cy * s;
    const tr = st.mode === 'drag' ? 'none' : st.mode === 'wheel' ? 'transform .18s ease-out' : 'transform .8s cubic-bezier(.65,0,.35,1)';
    const reveal = st.phase !== 'ask' && t;
    const countries = d ? d.c.map((c) => ({
      d: c.d, pick: this.picks[c.id],
      cls: 'land' + (c.q === 0 ? ' off' : '') + (reveal && c.id === t.id ? ' target' : '') + (reveal && c.id === st.picked && c.id !== t.id ? ' wrong' : '')
    })) : [];
    const pickedC = d && st.picked ? d.c.find((c) => c.id === st.picked) : null;
    const ok = t && st.picked === t.id;
    const name = t ? t.n : '';
    const pad = (n) => String(n).padStart(2, '0');
    let verdict = 'Übersprungen.', detail = name + ' ist schwarz markiert.', verdictColor = '#6B6B6B';
    if (ok) { verdict = 'Richtig.'; detail = 'Weiter geht’s gleich.'; verdictColor = okc; }
    else if (pickedC) { verdict = 'Falsch.'; detail = 'Du hast ' + pickedC.n + ' gewählt. ' + name + ' ist schwarz markiert.'; verdictColor = accent; }
    const W = d ? d.w : 1000;
    return {
      accent, ok: okc, ready: !!d, loading: !d, setEl: this.setEl, focusBtn: this.focusBtn, down: this.down, move: this.move, up: this.up,
      dragCls: st.mode === 'drag' && this.p ? 'drag' : '', liveCls: st.phase === 'ask' ? 'live' : '',
      tf: 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + s.toFixed(4) + ')', tr,
      copies: [{ t: 'translate(' + (-W) + ',0)' }, { t: 'translate(0,0)' }, { t: 'translate(' + W + ',0)' }],
      mw: W, mh: d ? d.h : 500,
      gx: d ? d.gx.map((v) => ({ v })) : [], gy: d ? d.gy.map((v) => ({ v })) : [],
      countries,
      counter: pad(Math.min(st.qi + 1, this.ROUND)) + ' / ' + this.ROUND, scorePad: pad(st.score), popCls: st.score === 0 ? '' : st.score % 2 ? 'pop-a' : 'pop-b',
      targetName: name || '—', nameSize: name.length <= 11 ? '40px' : name.length <= 18 ? '32px' : '26px',
      targetFlag: t ? this.flagBg(t.id) : 'visibility:hidden',
      anim: st.qi % 2 ? 'in-a' : 'in-b', flagAnim: st.qi % 2 ? 'fl-a' : 'fl-b',
      asking: st.phase === 'ask', answered: st.phase === 'answered', done: st.phase === 'done', auto: st.phase === 'answered' && ok,
      verdict, detail, verdictColor, verdictLabel: 'Frage ' + pad(st.qi + 1),
      hasPickedFlag: !!pickedC && !ok, pickedFlag: pickedC ? this.flagBg(pickedC.id) : '', pickedName: pickedC ? pickedC.n : '',
      nextLabel: st.qi + 1 >= this.ROUND ? 'Ergebnis' : 'Weiter',
      finalScore: st.score + '/' + this.ROUND,
      finalText: st.score >= 16 ? 'Starke Runde.' : st.score >= 10 ? 'Solide. Die Lücken holst du dir in der nächsten Runde.' : 'Da geht noch was. Nächste Runde.',
      next: this.next, skip: this.skip, newRound: this.newRound, zoomIn: this.zoomIn, zoomOut: this.zoomOut,
      menuOpen: st.menu, openMenu: this.openMenu, closeMenu: this.closeMenu
    };
  }
}
</script>
